
<!DOCTYPE html>
<html>
<head>
<title>Movie Review</title>
</head>
<body>

<h2>Movie Review and Rating</h2>

<form>
<label>Movie Name:</label>
<input type="text" placeholder="Enter movie name"><br><br>

<label>Rating:</label>
<select>
<option>5 Stars</option>
<option>4 Stars</option>
<option>3 Stars</option>
<option>2 Stars</option>

</select><br><br>

<label>Review:</label><br>
<textarea placeholder="Write your review"></textarea><br><br>

<button type="button" onclick="alert('Review Submitted!')">
Submit Review
</button>
</form>

</body>
</html>
