
<!DOCTYPE html>
<html>
<head>
<title>Ticket Booking</title>
</head>
<body>
<h2>Bus and Train Ticket Booking</h2>
<form>
  <label>Choose Travel:</label>
  <select>
    <option>Bus</option>
    <option>Train</option>
  </select><br><br>
  <label>From:</label>
  <input type="text" placeholder="Starting place"><br><br>
  <label>To:</label>
  <input type="text" placeholder="Destination"><br><br>
  <label>Date:</label>
  <input type="date"><br><br>
  <label>Passengers:</label>
  <input type="number" min="1" value="1"><br><br>
  <button type="button" onclick="alert('Booking Successful!')">
    Book Ticket
  </button>
</form>
</body>
</html>
